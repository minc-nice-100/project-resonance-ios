name: CI

on:
  push:
    branches: [master, main, release]
  pull_request:
    branches: [master, main, release]

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify XcodeGen
        run: which xcodegen || brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Show project structure
        run: |
          echo "=== Project Files ==="
          find . -name "*.swift" -o -name "*.yml" -o -name "*.plist" | head -50

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: List Available Simulators
        run: xcrun simctl list devices available | grep -E "iPhone|iPad" | head -10

      - name: Cache Swift Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            .build
            .swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build iOS Project
        run: |
          xcodebuild -project Resonance.xcodeproj \
            -scheme Resonance \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -quiet \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Success
        if: success()
        run: echo "Build completed successfully"

      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/**/*.xcresult

  release:
    needs: build
    if: github.ref == 'refs/heads/release' && github.event_name == 'push'
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify XcodeGen
        run: which xcodegen || brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build IPA
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -project Resonance.xcodeproj \
            -scheme Resonance \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -quiet \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Export IPA
        if: success()
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Release-iphoneos/Resonance.xcarchive \
            -exportPath build/Release-iphoneos \
            -exportOptionsPlist Resonance/Resources/export_options.plist

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: resonance-ipa
          path: build/Release-iphoneos/*.ipa